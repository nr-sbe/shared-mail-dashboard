name = "shared-mail"
account_id = "50dc1cb36a6965ac87fe3b41ce35d911"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "shared-mail"
database_id = "805d1259-ad69-4ae7-82fa-3192e36d890c"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# The Free plan enforces its own CPU limit; configurable limits require Paid.
